[package]
name = "tunecraft"
version = "0.1.0"
edition = "2024"
description = "TuneCraft: a music player with a built-in web browser, in the Craft apps' style"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["music", "player", "egui", "audio", "playlist"]
categories = ["multimedia::audio"]

[dependencies]
arboard = "3.7.0"
dirs = "7.0.0"
eframe = "0.37.0"
egui = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff"] }
lofty = "0.25.5"
rfd = "0.18.0"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "symphonia-all"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.5.2"
walkdir = "2.5.0"
wry = "0.57.3"

[target.'cfg(target_os = "macos")'.dependencies]
winit = { version = "0.30", default-features = false }
# a still picture of the web page while menus are open (WKWebView snapshot)
objc2 = "0.6"
block2 = "0.6"
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }
objc2-app-kit = { version = "0.3", features = ["NSImage"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSError"] }

[profile.release]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
